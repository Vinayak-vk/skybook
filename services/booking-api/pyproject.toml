[project]
name = "skybook-booking-api"
version = "1.0.0"
description = "SkyBook booking API"
requires-python = ">=3.13"
# Runtime and dev dependencies are pinned in requirements*.txt, which the
# Dockerfile and CI install from.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # SQLite (tests only) has no native DECIMAL type; Postgres does.
    "ignore:Dialect sqlite.pysqlite does .not. support Decimal objects natively",
    # Starlette's TestClient prefers the httpx2 package; httpx is what the app uses.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
