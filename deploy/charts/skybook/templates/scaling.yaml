{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- if $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "skybook.labels" $ | nindent 4 }}
    {{- include "skybook.selectorLabels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: {{ include "skybook.workloadApiVersion" $ }}
    kind: {{ include "skybook.workloadKind" $ }}
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilization }}
{{- end }}
{{- if $.Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "skybook.labels" $ | nindent 4 }}
    {{- include "skybook.selectorLabels" $ctx | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "skybook.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
