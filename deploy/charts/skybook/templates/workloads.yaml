{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "skybook.labels" $ | nindent 4 }}
    {{- include "skybook.selectorLabels" $ctx | nindent 4 }}
    {{- if $svc.metrics }}
    skybook.io/metrics: "true"
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "skybook.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: {{ include "skybook.workloadApiVersion" $ }}
kind: {{ include "skybook.workloadKind" $ }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "skybook.labels" $ | nindent 4 }}
    {{- include "skybook.selectorLabels" $ctx | nindent 4 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "skybook.selectorLabels" $ctx | nindent 6 }}
  {{- if $.Values.rollout.enabled }}
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause:
            duration: {{ $.Values.rollout.pauseDuration }}
        {{- if and $svc.metrics $.Values.monitoring.enabled }}
        # Promote only if the error ratio stays under the threshold.
        - analysis:
            templates:
              - templateName: skybook-error-ratio
            args:
              - name: service
                value: {{ $name }}
        {{- end }}
        - setWeight: 100
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  template:
    {{- include "skybook.podTemplate" $ctx | nindent 4 }}
{{- end }}
