# Postgres managed by the CloudNativePG operator. The operator generates the
# "<name>-app" secret (username, password, uri) that booking-api reads.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.database.name }}
  labels:
    {{- include "skybook.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.instances }}
  storage:
    size: {{ .Values.database.storage }}
  bootstrap:
    initdb:
      database: skybook
      owner: skybook
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.database.name }}
  labels:
    {{- include "skybook.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.database.name }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
