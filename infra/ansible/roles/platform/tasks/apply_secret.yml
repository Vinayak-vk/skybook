---
# Applies the Secret passed in as `platform_secret` without leaking it:
#  * The manifest reaches kubectl on stdin, so it is never in process args or a temp file.
#  * Server-side apply, so kubectl doesn't copy the values into the
#    kubectl.kubernetes.io/last-applied-configuration annotation (which
#    `kubectl describe` prints).
#  * `kubectl diff` runs first (exit 0 = identical, 1 = differs) so re-runs report
#    "ok", not "changed". kubectl masks Secret values in its diff.

- name: Compare secret {{ platform_secret.metadata.namespace ~ '/' ~ platform_secret.metadata.name }}
  ansible.builtin.command:
    cmd: >-
      kubectl diff --server-side --force-conflicts
      --field-manager={{ platform_field_manager }} -f -
    stdin: "{{ platform_secret | to_json }}"
  environment: "{{ platform_kube_env }}"
  register: platform_secret_diff
  changed_when: false
  failed_when: platform_secret_diff.rc not in [0, 1]
  no_log: true

- name: Apply secret {{ platform_secret.metadata.namespace ~ '/' ~ platform_secret.metadata.name }}
  ansible.builtin.command:
    cmd: >-
      kubectl apply --server-side --force-conflicts
      --field-manager={{ platform_field_manager }} -f -
    stdin: "{{ platform_secret | to_json }}"
  environment: "{{ platform_kube_env }}"
  when: platform_secret_diff.rc == 1
  changed_when: true
  no_log: true
