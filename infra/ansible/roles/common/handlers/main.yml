---
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

# Open sessions (including Ansible's own connection) survive an sshd restart.
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
