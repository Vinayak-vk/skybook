# SkyBook Ansible settings.
# Ansible ignores this file when the current directory is world-writable, which is
# the case for /mnt/c/... under WSL. Run from there with ANSIBLE_CONFIG set, e.g.
#   ANSIBLE_CONFIG=ansible.cfg ansible-playbook site.yml --ask-vault-pass
# (see README.md).

[defaults]
inventory = inventory/hosts.ini
roles_path = roles
remote_user = ubuntu
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
# accept-new: trust the key of a brand-new VM on first connect, refuse it if it ever changes.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
